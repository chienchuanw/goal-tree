services:
  db:
    image: postgres:16
    container_name: goal-tree-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goal_tree
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goal_tree"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - goal_tree_pgdata:/var/lib/postgresql/data

volumes:
  goal_tree_pgdata:
