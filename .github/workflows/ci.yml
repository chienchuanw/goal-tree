name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goal_tree
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/goal_tree
      AUTH_SECRET: ci-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_GITHUB_ID: ci-id
      AUTH_GITHUB_SECRET: ci-secret
      ALLOWED_GITHUB_ID: '0'
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec tsx src/db/migrate.ts
      - run: pnpm test:unit
      - run: pnpm exec vitest run --project integration
